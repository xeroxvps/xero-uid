kind = "web"
previewPath = "/"
title = "UID Operator Web"
version = "1.0.0"
id = "artifacts/uid-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21268

[services.development]
run = "pnpm --filter @workspace/uid-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/uid-web", "run", "build" ]
publicDir = "artifacts/uid-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21268"
BASE_PATH = "/"
